[workspace]
resolver = "3"
members = ["crates/gw2dat", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
# Smaller binaries for the release builds: no symbols, whole-program
# optimisation across all crates.
strip = true
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
# Incremental builds repeatedly left stale artifacts behind ("undefined hidden
# symbol ... .llvm.*" at link time). The workspace crates are small enough to
# rebuild in full.
incremental = false
